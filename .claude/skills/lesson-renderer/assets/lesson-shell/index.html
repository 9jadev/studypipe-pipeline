<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>StudyPipe Lesson</title>
  <link rel="stylesheet" href="lesson.css">
</head>
<body>
  <header class="top">
    <div class="meta" id="meta"></div>
    <div class="progress"><div class="bar" id="bar"></div></div>
  </header>

  <main id="stage" aria-live="polite"></main>

  <nav class="controls">
    <button id="prev" class="btn ghost" aria-label="Previous">&larr; Back</button>
    <button id="speak" class="btn round" aria-label="Play narration">&#9654;</button>
    <button id="next" class="btn" aria-label="Next">Next &rarr;</button>
  </nav>

  <script src="lesson-data.js"></script>
  <script src="player.js"></script>
</body>
</html>
